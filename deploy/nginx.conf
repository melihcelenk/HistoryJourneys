# Static hosting of the build. The application routes with the URL hash, so every request is a real file.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml application/wasm;
    gzip_min_length 1024;

    # The image's mime.types already knows wasm and webmanifest. A `types` block here would replace that whole list.
    location ~* \.glb$ {
        try_files $uri =404;
        default_type model/gltf-binary;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Files named by their content hash never change: cached for a year. A missing one is a plain 404 that is not
    # cached, never the page in its place (a CDN would otherwise keep the page under the asset's name).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # The page, the service worker and its manifest are checked on every visit, so a new version arrives at once.
    location ~* ^/(index\.html|sw\.js|registerSW\.js|workbox-[^/]+\.js|manifest\.webmanifest)?$ {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Content database, map data, portraits and icons keep their names between versions: revalidated by ETag.
    location / {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
}
